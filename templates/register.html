{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6">
        <div class="card-modern p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus" style="font-size: 2rem; color: #3b82f6;"></i>
                <h2 style="font-size: 1.25rem; font-weight: 600; color: #1e293b; margin-top: 0.5rem;">Create Account</h2>
                <p style="font-size: 0.875rem; color: #64748b;">Join DocGuard secure document platform</p>
            </div>
            
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size: 0.8rem;">Full Name</label>
                    <input type="text" name="full_name" class="form-control form-modern" 
                           placeholder="Ahmad Bin Abdullah" required autofocus>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size: 0.8rem;">Email Address</label>
                    <input type="email" name="email" class="form-control form-modern" 
                           placeholder="ahmad@school.edu.my" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="font-size: 0.8rem;">Password</label>
                    <input type="password" name="password" class="form-control form-modern" 
                           placeholder="Create a strong password" required>
                    <small class="text-muted" style="font-size: 0.7rem;">Password will be securely hashed</small>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    Create Account
                </button>
            </form>
            
            <hr class="my-4" style="border-color: #eef2f6;">
            
            <p class="text-center mb-0" style="font-size: 0.8rem;">
                Already have an account? 
                <a href="{{ url_for('login') }}" style="color: #3b82f6; text-decoration: none;">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

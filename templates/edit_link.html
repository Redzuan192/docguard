{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card-modern">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-pencil-square" style="font-size: 2rem; color: #3b82f6;"></i>
                    <h2 style="font-size: 1.25rem; font-weight: 600; margin-top: 0.5rem;">Edit Share Link</h2>
                    <p style="font-size: 0.8rem; color: #64748b;">Modify your shared link settings</p>
                </div>
                
                <div class="alert alert-light mb-4" style="background: #f8fafc; border: 1px solid #eef2f6; border-radius: 12px;">
                    <p style="margin-bottom: 0.25rem;"><strong style="font-size: 0.8rem;">File:</strong> <span style="font-size: 0.8rem;">{{ link.original_filename }}</span></p>
                    <p style="margin-bottom: 0;"><strong style="font-size: 0.8rem;">Token:</strong> <code style="font-size: 0.7rem;">{{ link.token }}</code></p>
                </div>
                
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size: 0.8rem;">Expiry Date & Time</label>
                        <input type="datetime-local" name="expiry_date" class="form-control form-modern" 
                               value="{{ link.expiry_date.strftime('%Y-%m-%dT%H:%M') if link.expiry_date else '' }}" required>
                        <small style="font-size: 0.7rem; color: #64748b;">Current: {{ link.expiry_date.strftime('%d %b %Y, %H:%M') if link.expiry_date else 'N/A' }}</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size: 0.8rem;">Maximum Views</label>
                        <input type="number" name="max_views" class="form-control form-modern" min="1" value="{{ link.max_views }}" required>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="allow_download" value="1" id="allow_download" {% if link.allow_download %}checked{% endif %}>
                        <label for="allow_download" class="form-check-label" style="font-size: 0.8rem;">Allow Download</label>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" name="is_active" value="1" id="is_active" {% if link.is_active %}checked{% endif %}>
                        <label for="is_active" class="form-check-label" style="font-size: 0.8rem;">Link Active</label>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2">
                        <i class="bi bi-save"></i> Save Changes
                    </button>
                    <a href="{{ url_for('my_links') }}" class="btn btn-outline-custom w-100 mt-2">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

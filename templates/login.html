{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div style="background: transparent;">
            <div class="text-center mb-4">
                <div class="login-logo mx-auto mb-3">
    <i class="bi bi-shield-lock-fill"></i>
</div>

<h2 style="font-size:1.8rem;font-weight:700;color:#1e293b;">
    DocGuard System
</h2>

<p style="font-size:0.9rem;color:#64748b;">
    Secure Document Sharing Platform
</p>
            </div>
            
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size: 0.8rem;">Email Address</label>
                    <input type="email" name="email" class="form-control form-modern" 
                           placeholder="Enter your email" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="font-size: 0.8rem;">Password</label>
                    <input type="password" name="password" class="form-control form-modern" 
                           placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    Sign In
                </button>

                <a href="{{ url_for('google_login') }}" class="btn btn-outline-danger w-100 py-2 mt-3">
                    <i class="bi bi-google me-2"></i> Continue with Google
                </a>
            </form>
            
            <hr class="my-4" style="border-color: #eef2f6;">
            
            <p class="text-center mb-0" style="font-size: 0.8rem;">
                Don't have an account? 
                <a href="{{ url_for('register') }}" style="color: #3b82f6; text-decoration: none;">Create account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
